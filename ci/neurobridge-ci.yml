# Template only: GitHub Actions requires this file at .github/workflows/ci.yml.
# It is stored under ci/ because the initial OAuth push lacked workflow scope.
name: Validate NeuroBridge source
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight CLI requirements
        run: python -m pip install -e .
      - name: Check Python compilation
        run: python -m compileall -q neurobridge analysis
      - name: CLI validation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Scientific invariant tests
        run: python -m unittest discover -s analysis/tests -p 'test_*.py' -v
