name: Validate source
on:
  push:
  pull_request:
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy pandas scipy scikit-learn matplotlib
      - name: Compile analysis scripts
        run: python -m compileall -q analysis
      - name: Run five invariant tests
        run: python -m unittest discover -s analysis/tests -p 'test_*.py' -v
